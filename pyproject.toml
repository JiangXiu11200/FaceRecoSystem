[project]
name = "FaceRecoSystem"
version = "0.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "channels>=4.2.2",
    "cryptography>=45.0.5",
    "django>=4.2.23",
    "djangorestframework>=3.16.0",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=23.0.0",
    "psycopg2>=2.9.10",
    "rest-framework-simplejwt>=0.0.2",
    "ruff>=0.12.5",
    "uvicorn>=0.35.0",
]


[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [".git", ".venv", "migrations/"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
