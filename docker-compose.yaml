version: "3.8"
services:


  frontend:
    image: facereco-frontend:1.0.0
    container_name: facereco-frontend
    restart: always
    ports:
      - "3001:3001"
    networks:
      - server_network
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

  backend:
    image: facereco-backend:1.0.0
    container_name: facereco-backend
    restart: always
    ports:
      - "8000:8000"
    networks:
      - server_network
    volumes:
      - ./backend/settings.toml:/backend/settings.toml
    entrypoint: ["/entrypoint.sh"]
    command: ["uv", "run", "uvicorn", "app_server.asgi:application", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - postgres
      - redis
      - minio

  celery_worker:
    image: facereco-backend:1.0.0
    container_name: facereco-celery-worker
    restart: always
    networks:
      - server_network
    volumes:
      - ./backend/settings.toml:/backend/settings.toml
    environment:
      POSTGRES_HOST: "facereco-postgres"
      POSTGRES_PORT: "5432"
      REDIS_HOST: "facereco-redis"
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: "redis://facereco-redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://facereco-redis:6379/0"
      C_FORCE_ROOT: "true"
    command: ["uv", "run", "celery", "-A", "app_server", "worker", "--loglevel=info", "--concurrency=4"]
    depends_on:
      - redis
      - postgres
      - minio

  celery_beat:
    image: facereco-backend:1.0.0
    container_name: facereco-celery-beat
    restart: always
    networks:
      - server_network
    volumes:
      - ./backend/settings.toml:/backend/settings.toml
      - ./docker-volumes/celerybeat-schedule:/app/celerybeat-schedule
    environment:
      POSTGRES_HOST: "facereco-postgres"
      POSTGRES_PORT: "5432"
      REDIS_HOST: "facereco-redis"
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: "redis://facereco-redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://facereco-redis:6379/0"
    command: ["uv", "run", "celery", "-A", "app_server", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      - redis
      - postgres

  flower:
    image: facereco-backend:1.0.0
    container_name: facereco-flower
    restart: always
    ports:
      - "5555:5555"
    networks:
      - server_network
    volumes:
      - ./backend/settings.toml:/backend/settings.toml
    environment:
      CELERY_BROKER_URL: "redis://facereco-redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://facereco-redis:6379/0"
      FLOWER_BASIC_AUTH: "user:abcde12345"
    command: ["uv", "run", "celery", "-A", "app_server", "flower", "--port=5555", "--basic_auth=user:abcde12345"]
    depends_on:
      - redis
      - celery_worker

  redis:
    image: redis:8.0.3
    container_name: facereco-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - server_network
    volumes:
      - ./docker-volumes/redis:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]


  minio:
    image: quay.io/minio/minio
    container_name: facereco-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/certs:/root/.minio/certs:ro
      - ./minio/cors.json:/root/.minio/config/cors.json
      - ./minio:/data
    networks:
      - server_network
    environment:
      MINIO_ROOT_USER: <MINIO_USER>
      MINIO_ROOT_PASSWORD: <MINIO_PASSWORD>
      MINIO_SERVER_URL: "http://facereco-minio:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://<YOUR_DOMAIN>:3001/minio-console"
    command: server /data --console-address ":9001"

  postgres:
    image: postgres:16
    container_name: facereco-postgres
    environment:
      POSTGRES_USER: <PASSWORD>
      POSTGRES_PASSWORD: <PASSWORD>
      POSTGRES_DB: facereco
    ports:
      - "5432:5432"
    networks:
      - server_network
    volumes:
      - ./docker-volumes/postgre:/var/lib/postgresql/data

networks:
  server_network:
    driver: bridge
