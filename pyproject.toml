[project]
name = "FaceRecoSystem"
version = "0.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "celery>=5.5.3",
    "channels>=4.2.2",
    "cryptography>=45.0.5",
    "daphne>=4.2.1",
    "django>=4.2.23",
    "django-celery-beat>=2.8.1",
    "django-cors-headers>=4.7.0",
    "django-filter>=25.1",
    "djangorestframework>=3.16.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.28.0",
    "ffmpeg>=1.4",
    "flower>=2.0.1",
    "gunicorn>=23.0.0",
    "minio>=7.2.16",
    "psycopg2>=2.9.10",
    "pydantic>=2.11.7",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rest-framework-simplejwt>=0.0.2",
    "ruff>=0.12.5",
    "toml>=0.10.2",
    "uvicorn>=0.35.0",
    "websockets>=15.0.1",
]


[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [".git", ".venv", "migrations/"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
