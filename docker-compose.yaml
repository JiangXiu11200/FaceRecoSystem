version: "3.8"
services:


  frontend:
    image: facereco-frontend:1.0.0
    container_name: facereco-frontend
    restart: always
    ports:
      - "3001:3001"
    networks:
      - server_network
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

  backend:
    image: facereco-backend:1.0.0
    container_name: facereco-backend
    restart: always
    ports:
      - "8000:8000"
    networks:
      - server_network
    volumes:
      - ./backend/settings.toml:/backend/settings.toml
    environment:
      POSTGRES_HOST: "facereco-postgres"
      POSTGRES_PORT: "5432"

  minio:
    image: quay.io/minio/minio
    container_name: facereco-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/certs:/root/.minio/certs:ro
      - ./minio/cors.json:/root/.minio/config/cors.json
      - ./minio:/data
    networks:
        - server_network
    environment:
      MINIO_ROOT_USER: <MINIO_USER>
      MINIO_ROOT_PASSWORD: <MINIO_PASSWORD>
      MINIO_SERVER_URL: "http://127.0.0.1:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://127.0.0.1:9001"
    command: server /data --console-address ":9001"

  postgres:
    image: postgres:16
    container_name: facereco-postgres
    environment:
      POSTGRES_USER: <PASSWORD>
      POSTGRES_PASSWORD: <PASSWORD>
      POSTGRES_DB: facereco
    ports:
      - "5432:5432"
    networks:
      - server_network
    volumes:
      - ./docker-volumes/postgre:/var/lib/postgresql/data

networks:
  server_network:
    driver: bridge
