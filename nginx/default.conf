upstream minio_console {
    server facereco-minio:9001;
}

upstream minio_api {
    server facereco-minio:9000;
}

upstream backend_api {
    server facereco-backend:8000;
}

server {
    listen 3001;
    server_name localhost;

    root /frontend/;  # SPA root directory
    index index.html;

    client_max_body_size 50M;

    # MinIO Console (Web UI)
    location ~ ^/minio-console(/.*)?$ {
        proxy_pass http://minio_console$1$is_args$args;

        # set headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Instant response and reduce latency
        proxy_buffering off;
        proxy_request_buffering off;

        # Long timeouts for large file uploads/downloads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # MinIO API
    location ~ ^/minio(/.*)?$ {
        proxy_pass http://minio_api$1$is_args$args;

        # Set headers
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Amz-Date $http_x_amz_date;
        proxy_set_header X-Amz-Content-SHA256 $http_x_amz_content_sha256;
        proxy_set_header X-Amz-Security-Token $http_x_amz_security_token;

        proxy_set_header Host facereco-minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support large file uploads
        client_max_body_size 0;
        proxy_buffering off;
        proxy_request_buffering off;

        # Long timeouts for large file uploads/downloads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # API proxy
    location /api {
        proxy_pass http://backend_api;

        # Set headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files caching
    location ~ ^/(?!minio-console|minio|api).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        try_files $uri =404;
    }

    # SPA routing
    location / {
        try_files $uri /index.html;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}
